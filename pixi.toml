[workspace]
channels = ["https://prefix.dev/glatzel", "conda-forge"]
name = "fornax"
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[feature.dev.dependencies]
libraw-dev = "==0.22.3"
maturin = "==1.15.0"
pip = "==26.2.1"
python = "3.13.*"

imageio = "==2.38.1"
lazy-loader = "==0.6"
msgspec = "==0.22.0"
nomkl = "==1.0"
numpy = "2.3.*"
numpydoc = "==1.11.0"
pydantic = "==2.14.1"

# test
pytest = "==9.1.1"
pytest-cov = "==7.1.0"

[feature.agent.dependencies]
codex = "*"
codex-config = "*"
skill-glatzel = "*"

[environments]
default = ["dev"]
agent = ["agent"]
