[workspace]
channels = ["https://prefix.dev/glatzel", "conda-forge"]
name = "fornax"
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[feature.dev.dependencies]
libraw-dev = "==0.22.3"

[feature.python.dependencies]
maturin = "==1.15.0"
pip = "==26.2.2"
python = "3.13.*"

imageio = "==2.38.1"
lazy-loader = "==0.6"
msgspec = "==0.22.0"
nomkl = "*"
numpy = "2.3.*"
numpydoc = "==1.11.0"
pydantic = "==2.14.1"

# test
pytest = "==9.1.1"
pytest-cov = "==7.1.0"

[feature.agent.dependencies]
codex = "*"
codex-config = "*"
skill-glatzel = "*"
codex-rtk = "*"

[feature.data.dependencies]
aria2 = "*"
python-duckdb = "*"
httpx = "*"
nomkl = "*"
typer = "*"

[feature.data.tasks]
get-raw-samples = "python $PIXI_WORKSPACE_ROOT/scripts/get_raw_samples.py"

[environments]
default = []
dev = {
  features = ["dev"],
  tasks = {
    pipeline = "cargo run --example pipeline",
    compare-demosaic = "cargo run -p compare-demosaic"
  }
}
python = ["dev", "python"]
agent = ["agent"]
data = ["data"]
