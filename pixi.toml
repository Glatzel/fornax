[workspace]
channels = ["https://prefix.dev/glatzel", "conda-forge"]
name = "fornax"
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[feature.duckdb.dependencies]
duckdb-cli = "*"

[feature.tracker.dependencies]
pathspec = "*"
python = "3.13.*"
python-duckdb = "*"
pytest = "==9.2.0"
ruff = "*"
typer = "*"

[feature.tracker.tasks]
decoder-tracker = "cargo run -q -p decoder-tracker --"
decoder-tracker-release = "cargo run --release -q -p decoder-tracker --"
tracker-badge = "bash crates/decoder-tracker/scripts/update-badge.sh"
tracker-data = "python crates/decoder-tracker/scripts/tracker_data.py"
tracker-lint = "ruff check crates/decoder-tracker/scripts && ruff format --check crates/decoder-tracker/scripts"
tracker-test = "ruff check crates/decoder-tracker/scripts && ruff format --check crates/decoder-tracker/scripts && cargo test -p decoder-tracker && python -m pytest crates/decoder-tracker/scripts/test_tracker_data.py"

[feature.python.dependencies]
maturin = "==1.16.0"
pip = "==26.2.2"
python = "3.13.*"
imageio = "==2.38.2"
lazy-loader = "==0.6"
msgspec = "==0.22.0"
nomkl = "*"
numpy = "2.3.*"
numpydoc = "==1.11.0"
pydantic = "==2.14.4"
pytest = "==9.2.0"
pytest-cov = "==7.1.0"

[feature.book.dependencies]
matplotlib-base = "3.11.*"
python = "3.13.*"

[feature.book.activation.env]
MPLBACKEND = "Agg"
MPLCONFIGDIR = "$PIXI_WORKSPACE_ROOT/temp/book/matplotlib"

[feature.book.tasks]
book-figures = "python -m book.figures"

[feature.compare-demosaic.dependencies]
matplotlib-base = "3.11.*"
nomkl = "*"
numpy = "2.3.*"
pillow = "*"
pytest = "==9.2.0"
python = "3.13.*"
resvg = "*"
ruff = "*"
scikit-image = "*"
tifffile = "*"
typer = "*"

[feature.compare-demosaic.activation.env]
MPLBACKEND = "Agg"
MPLCONFIGDIR = "$PIXI_WORKSPACE_ROOT/temp/compare-demosaic/matplotlib"

[feature.compare-demosaic.tasks]
chart-svg = "python crates/compare-demosaic/scripts/generate_chart.py svg"
chart-tiffs = "python crates/compare-demosaic/scripts/generate_chart.py export"
chart = "python crates/compare-demosaic/scripts/generate_chart.py all"
demosaic = "cargo run --release -q -p compare-demosaic --"
evaluate = "python crates/compare-demosaic/scripts/evaluate.py"
mtf = "python crates/compare-demosaic/scripts/mtf.py"
compare-demosaic = "bash crates/compare-demosaic/scripts/run.sh"
compare-demosaic-lint = "ruff check crates/compare-demosaic/scripts && ruff format --check crates/compare-demosaic/scripts"
compare-demosaic-test = "ruff check crates/compare-demosaic/scripts && ruff format --check crates/compare-demosaic/scripts && cargo test -p compare-demosaic && python -m pytest crates/compare-demosaic/scripts/"

[environments]
default = []
dev = { features = ["duckdb", "tracker"], tasks = { fornax-raw-cli = "cargo run -p fornax-raw-cli" } }
python = ["python"]
book = ["book"]
tracker = ["duckdb", "tracker"]
compare-demosaic = ["compare-demosaic"]
