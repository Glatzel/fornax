[workspace]
channels = ["https://prefix.dev/glatzel", "conda-forge"]
name = "fornax"
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[feature.dev.dependencies]
libraw-dev = "==0.22.3"

[feature.python.dependencies]
maturin = "==1.16.0"
pip = "==26.2.2"
python = "3.13.*"
imageio = "==2.38.1"
lazy-loader = "==0.6"
msgspec = "==0.22.0"
nomkl = "*"
numpy = "2.3.*"
numpydoc = "==1.11.0"
pydantic = "==2.14.3"
pytest = "==9.2.0"
pytest-cov = "==7.1.0"

[feature.data.dependencies]
aria2 = "*"
python-duckdb = "*"
httpx = "*"
nomkl = "*"
typer = "*"

[feature.data.tasks]
get-raw-samples = "python $PIXI_WORKSPACE_ROOT/scripts/get_raw_samples.py"

[feature.book.dependencies]
matplotlib-base = "3.11.*"
python = "3.13.*"

[feature.book.activation.env]
MPLBACKEND = "Agg"
MPLCONFIGDIR = "$PIXI_WORKSPACE_ROOT/temp/book/matplotlib"

[feature.book.tasks]
book-figures = "python -m book.figures"

[environments]
default = []
dev = { features = ["dev"], tasks = { pipeline = "cargo run -p fornax-cli --" } }
python = ["dev", "python"]
data = ["data"]
book = ["book"]
