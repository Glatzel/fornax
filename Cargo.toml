[workspace]
resolver = "3"
members = ["./crates/*"]
exclude = ["./crates/fornax-raw-py/"]  # temporary exclude before api stable.

[workspace.package]
version = "0.0.17"
edition = "2024"

[workspace.dependencies]
fornax-bmff = { path = "./crates/fornax-bmff" }
fornax-codec = { path = "./crates/fornax-codec" }
fornax-devtool = { path = "./crates/fornax-devtool" }
fornax-dng = { path = "./crates/fornax-dng" }
fornax-tiff = { path = "./crates/fornax-tiff" }

fornax-raw = { path = "./crates/fornax-raw" }
fornax-raw-canon = { path = "./crates/fornax-raw-canon" }
fornax-raw-core = { path = "./crates/fornax-raw-core" }
fornax-raw-decoder = { path = "./crates/fornax-raw-decoder" }
fornax-raw-fujifilm = { path = "./crates/fornax-raw-fujifilm" }
fornax-raw-hasselblad = { path = "./crates/fornax-raw-hasselblad" }
fornax-raw-nikon = { path = "./crates/fornax-raw-nikon" }
fornax-raw-panasonic = { path = "./crates/fornax-raw-panasonic" }
fornax-raw-phase-one = { path = "./crates/fornax-raw-phase-one" }
fornax-raw-pipeline = { path = "./crates/fornax-raw-pipeline" }
fornax-raw-sony = { path = "./crates/fornax-raw-sony" }

# glatzel
clap-style = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
generic-num = {
  git = "https://github.com/Glatzel/toolbox",
  tag = "v2026.10.11"
}
image = {
  git = "https://github.com/Glatzel/image-rs",
  default-features = false
}
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }

# other
assert_cmd = "2.2.2"
bytemuck = "1.25.2"
cc = "1.11.1"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
criterion = { package = "codspeed-criterion-compat", version = "6.0.0" }
csv = "1.4.0"
flate2 = "1.1.11"
globset = "0.4.21"
hex = "0.4.3"
insta = { version = "1.49.0", features = ["json"] }
jxl-oxide = "0.12.6"
libc = "0.2.191"
memmap2 = "0.9.12"
num_enum = "0.7.6"
num-traits = "0.2.19"
predicates = "3.1.4"
rand = "0.10.3"
raw-cpuid = "11.6.0"
rayon = "1.12.0"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
weezl = "0.2.1"
zstd = "0.14.3"
zune-jpeg = "0.5.15"
