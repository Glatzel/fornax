[workspace]
resolver = "3"
members = ["./crates/*"]
exclude = ["./crates/fornax-py/"]  # temporary exclude before api stable.

[workspace.package]
version = "0.0.17"
edition = "2024"

[workspace.dependencies]
# local
fornax-core = { path = "./crates/fornax-core" }
fornax-decoder = { path = "./crates/fornax-decoder" }
fornax-devtool = { path = "./crates/fornax-devtool" }
fornax-postprocessor = { path = "./crates/fornax-postprocessor" }
fornax-preprocessor = { path = "./crates/fornax-preprocessor" }

# glatzel
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
generic-num = {
  git = "https://github.com/Glatzel/toolbox",
  tag = "v2026.10.11"
}
image = { git = "https://github.com/Glatzel/image-rs" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }

# other
cc = "1.10.0"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { package = "codspeed-criterion-compat", version = "6.0.0" }
hex = "0.4.3"
insta = { version = "1.49.0", features = ["json"] }
num_enum = "0.7.6"
num-traits = "0.2.19"
rand = "0.10.3"
rayon = "1.12.0"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tiff = "0.11.3"
