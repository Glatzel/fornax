[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "0.0.17"
edition = "2024"

[workspace.dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
envoy = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
generic-num = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
image = { git = "https://github.com/Glatzel/image-rs" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }

fornax = { path = "./crates/fornax" }
fornax-core = { path = "./crates/fornax-core" }
fornax-decoder-dnc = { path = "./crates/fornax-decoder-dnc" }
fornax-decoder-protocol = { path = "./crates/fornax-decoder-protocol" }
fornax-devtool = { path = "./crates/fornax-devtool" }
fornax-metadata = { path = "./crates/fornax-metadata" }
libraw = { path = "./crates/libraw" }
libraw-sys = { path = "./crates/libraw-sys" }

bindgen = "0.73.2"
criterion = { package = "codspeed-criterion-compat", version = "5.0.3" }
float-cmp = "0.10.0"
jiff = "0.2.38"
libc = "0.2.190"
num_enum = "0.7.6"
num-traits = "0.2.19"
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["abi3-py313", "extension-module"] }
rand = "0.10.3"
rayon = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
