[workspace]
resolver = "3"
members = ["./crates/*"]
exclude = ["./crates/fornax-py/"]  # temporary exclude before api stable.

[workspace.package]
version = "0.0.17"
edition = "2024"

[workspace.dependencies]
# local
fornax-core = { path = "./crates/fornax-core" }
fornax-decoder-dnc = { path = "./crates/fornax-decoder-dnc" }
fornax-decoder-rawler = { path = "./crates/fornax-decoder-rawler" }
fornax-devtool = { path = "./crates/fornax-devtool" }
fornax-postprocessor = { path = "./crates/fornax-postprocessor" }
fornax-preprocessor = { path = "./crates/fornax-preprocessor" }
libraw = { path = "./crates/libraw" }
libraw-sys = { path = "./crates/libraw-sys" }

# glatzel
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
envoy = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
generic-num = {
  git = "https://github.com/Glatzel/toolbox",
  tag = "v2026.10.11"
}
image = { git = "https://github.com/Glatzel/image-rs" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }

# other
bindgen = "0.73.2"
cc = "1.10.0"
comfy-table = { version = "8.0.1", default-features = false }
criterion = { package = "codspeed-criterion-compat", version = "6.0.0" }
float-cmp = "0.10.0"
indicatif = "0.18"
jiff = "0.2.38"
libc = "0.2.191"
num_enum = "0.7.6"
num-traits = "0.2.19"
rand = "0.10.3"
rawler = "0.8.0"
rayon = "1.12.0"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
