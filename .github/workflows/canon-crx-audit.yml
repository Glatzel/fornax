name: Canon CRX audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Materialize Canon corpus payloads
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
          git -C external/raw.pixls.us \
            -c filter.lfs.required=false \
            lfs pull --include='Canon/**/*.CR3,Canon/**/*.cr3'
      - name: Verify manifest
        run: cargo run -q -p decoder-tracker -- manifest --check
      - name: Audit CRX headers
        run: |
          cargo run --release -q -p fornax-devtool --bin canon-crx-audit -- \
            --corpus external/raw.pixls.us \
            --manifest crates/decoder-tracker/manifest.csv \
            --out target/canon-crx-audit.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canon-crx-audit
          path: target/canon-crx-audit.csv
          retention-days: 3
          if-no-files-found: error
