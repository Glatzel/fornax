name: Lefthook

on:
  workflow_dispatch:
  workflow_call:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write

jobs:
  lefthook:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, 'lefthook')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: Glatzel/template/.github/actions/common/lefthook@c4fc1ce5803cea6a9ea283ed57dda45efdd2f6fc # v2026.10.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
