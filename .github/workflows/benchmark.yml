name: benchmark

on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cargo-bench:
    if: github.event_name != 'pull_request' || contains(join(github.event.pull_request.labels.*.name, ','), 'perf')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            ./crates/bench-decoder/**
            ./crates/fornax-core/**
            ./crates/fornax-decoder-rawler/**
            ./crates/fornax-devtool/**
            ./crates/libraw/**
            ./crates/fornax-postprocessor/**
            ./crates/bench-demosaic/**
      - uses: Glatzel/template/.github/actions/rust/setup-rust@bc1c681e2b4bf1f60e69a5e372b696f4ff1ebf9d # v2026.10.13
        if: steps.changed-files.outputs.any_changed == 'true'
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@bc1c681e2b4bf1f60e69a5e372b696f4ff1ebf9d # v2026.10.13
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          options: -p bench-decoder -p bench-demosaic -p bench-preprocessor
        env:
          GH_TOKEN: ${{ github.token }}
