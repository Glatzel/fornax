name: Decoder corpus

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Repository-relative path glob. `*` stays within a segment; `**` crosses directories.
        type: string
        required: true
        default: "**/*.[dD][nN][gG]"
  push:
    branches:
      - task/dec-corpus-lfs-tracker
    paths:
      - .github/workflows/decoder-tracker-corpus.yml
      - crates/decoder-tracker/manifest.csv
      - crates/decoder-tracker/baseline.csv

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      filter: ${{ steps.plan.outputs.filter }}
      runner_count: ${{ steps.plan.outputs.runner_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Install tracker tools
        run: pixi install -e tracker
      - name: Test DuckDB aggregation
        run: pixi run -e tracker cargo test -q -p decoder-tracker --lib duckdb_
      - id: plan
        shell: bash
        env:
          REQUESTED_FILTER: ${{ inputs.filter }}
        run: |
          filter="${REQUESTED_FILTER:-**/*.[dD][nN][gG]}"
          result="$(
            pixi run -e tracker cargo run -q -p decoder-tracker -- select \
              --glob "$filter" \
              --out target/decoder-tracker/selected-manifest.csv
          )"
          printf '%s\n' "$result"
          case "$result" in
            selected=*) selected="${result#selected=}" ;;
            *)
              printf 'unexpected select output: %s\n' "$result" >&2
              exit 2
              ;;
          esac

          runner_count=$(( (selected + 9) / 10 ))
          if ((runner_count < 1)); then
            runner_count=1
          elif ((runner_count > 20)); then
            runner_count=20
          fi

          matrix='{"include":['
          for ((index = 0; index < runner_count; index++)); do
            if ((index > 0)); then
              matrix+=','
            fi
            matrix+="{\"index\":$index,\"count\":$runner_count}"
          done
          matrix+=']}'

          printf 'filter=%s\n' "$filter" >>"$GITHUB_OUTPUT"
          printf 'runner_count=%s\n' "$runner_count" >>"$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
          printf 'selected %s files across %s runners\n' "$selected" "$runner_count"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-selected-manifest
          path: target/decoder-tracker/selected-manifest.csv
          retention-days: 1
          if-no-files-found: error

  shard:
    name: shard ${{ matrix.index }}/${{ matrix.count }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decoder-selected-manifest
          path: target/decoder-tracker
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Install development tools
        run: pixi install -e dev
      - name: Check corpus manifest and run shard
        shell: bash
        env:
          CI: "true"
        run: |
          pixi run -e dev cargo run -q -p decoder-tracker -- manifest --check
          pixi run -e dev cargo run -q -p decoder-tracker -- run \
            --manifest target/decoder-tracker/selected-manifest.csv \
            --shard "${{ matrix.index }}/${{ matrix.count }}" \
            --out "target/decoder-tracker/shards/shard-${{ matrix.index }}.csv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-shard-${{ matrix.index }}
          path: target/decoder-tracker/shards/shard-${{ matrix.index }}.csv
          retention-days: 1
          if-no-files-found: error

  aggregate:
    name: aggregate
    needs: [plan, shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decoder-selected-manifest
          path: target/decoder-tracker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: decoder-shard-*
          path: target/decoder-tracker/shards
          merge-multiple: true
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Install tracker tools
        run: pixi install -e tracker
      - id: aggregate
        shell: bash
        run: |
          pixi run -e tracker cargo run -q -p decoder-tracker -- merge \
            --manifest target/decoder-tracker/selected-manifest.csv \
            --out target/decoder-tracker/candidate.csv \
            target/decoder-tracker/shards/*.csv

          mkdir -p target/decoder-tracker/update
          if [[ ! -f crates/decoder-tracker/baseline.csv ]]; then
            cp target/decoder-tracker/candidate.csv \
              target/decoder-tracker/update/baseline.csv
            printf 'outcome=bootstrap\n' >>"$GITHUB_OUTPUT"
            printf 'changed=true\n' >>"$GITHUB_OUTPUT"
            printf 'Bootstrap baseline captured.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          pixi run -e tracker cargo run -q -p decoder-tracker -- diff \
            --selected target/decoder-tracker/selected-manifest.csv \
            --out target/decoder-tracker/update/diff.csv \
            crates/decoder-tracker/baseline.csv \
            target/decoder-tracker/candidate.csv
          diff_status=$?
          set -e

          if ((diff_status == 0)); then
            printf 'outcome=unchanged\n' >>"$GITHUB_OUTPUT"
            printf 'changed=false\n' >>"$GITHUB_OUTPUT"
            printf 'Selected decoder rows are unchanged.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pixi run -e tracker cargo run -q -p decoder-tracker -- update \
            --baseline crates/decoder-tracker/baseline.csv \
            --candidate target/decoder-tracker/candidate.csv \
            --out target/decoder-tracker/update/baseline.csv
          printf 'outcome=changed\n' >>"$GITHUB_OUTPUT"
          printf 'changed=true\n' >>"$GITHUB_OUTPUT"
          printf 'Selected decoder rows changed; review the uploaded baseline update.\n' >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.aggregate.outputs.changed == 'true' }}
        with:
          name: decoder-baseline-update
          path: target/decoder-tracker/update
          retention-days: 3
          if-no-files-found: error
      - name: Fail when reviewed rows changed
        if: ${{ steps.aggregate.outputs.outcome == 'changed' }}
        run: exit 1
