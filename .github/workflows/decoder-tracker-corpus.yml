name: Decoder corpus

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap a candidate baseline or verify the committed baseline.
        type: choice
        options:
          - bootstrap
          - verify
        required: true
        default: verify
      shard_count:
        description: Number of deterministic decoder shards (1-20).
        type: string
        required: true
        default: "20"
  push:
    branches:
      - task/dec-corpus-lfs-tracker
    paths:
      - .github/workflows/decoder-tracker-corpus.yml
      - crates/decoder-tracker/manifest.csv
      - crates/decoder-tracker/baseline.csv

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      mode: ${{ steps.shards.outputs.mode }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: shards
        shell: bash
        env:
          REQUESTED_COUNT: ${{ inputs.shard_count }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          shard_count="${REQUESTED_COUNT:-20}"
          if [[ ! "$shard_count" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            printf 'shard_count must be an integer from 1 through 20\n' >&2
            exit 2
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$REQUESTED_MODE"
          elif [[ -f crates/decoder-tracker/baseline.csv ]]; then
            mode=verify
          else
            mode=bootstrap
          fi

          matrix='{"include":['
          for ((index = 0; index < shard_count; index++)); do
            if ((index > 0)); then
              matrix+=','
            fi
            matrix+="{\"index\":$index,\"count\":$shard_count}"
          done
          matrix+=']}'
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >>"$GITHUB_OUTPUT"
          printf 'shard_count=%s\n' "$shard_count" >>"$GITHUB_OUTPUT"
          printf 'planned %s shards in %s mode\n' "$shard_count" "$mode"

  shard:
    name: shard ${{ matrix.index }}/${{ matrix.count }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.shard_count) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Install development tools
        run: pixi install -e dev
      - name: Check corpus manifest and run shard
        shell: bash
        env:
          CI: "true"
        run: |
          pixi run -e dev cargo run -q -p decoder-tracker -- manifest --check
          pixi run -e dev cargo run -q -p decoder-tracker -- run \
            --shard "${{ matrix.index }}/${{ matrix.count }}" \
            --out "target/decoder-tracker/shards/shard-${{ matrix.index }}.csv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-shard-${{ matrix.index }}
          path: target/decoder-tracker/shards/shard-${{ matrix.index }}.csv
          retention-days: 1
          if-no-files-found: error

  aggregate:
    name: aggregate
    needs: [plan, shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: decoder-shard-*
          path: target/decoder-tracker/shards
          merge-multiple: true
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Install development tools
        run: pixi install -e dev
      - name: Merge shards
        shell: bash
        run: |
          pixi run -e dev cargo run -q -p decoder-tracker -- merge \
            --out target/decoder-tracker/candidate.csv \
            target/decoder-tracker/shards/*.csv
          printf 'candidate rows: '
          tail -n +2 target/decoder-tracker/candidate.csv | wc -l
      - name: Upload bootstrap candidate
        if: ${{ needs.plan.outputs.mode == 'bootstrap' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-baseline-candidate
          path: target/decoder-tracker/candidate.csv
          retention-days: 1
          if-no-files-found: error
      - name: Verify committed baseline
        if: ${{ needs.plan.outputs.mode == 'verify' }}
        shell: bash
        run: |
          pixi run -e dev cargo run -q -p decoder-tracker -- diff \
            crates/decoder-tracker/baseline.csv \
            target/decoder-tracker/candidate.csv
