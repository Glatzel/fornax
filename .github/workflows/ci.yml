name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write

  main:
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-latest
            test-options: --workspace --all-features --exclude compare-demosaic
            pwd: ./
          - machine: ubuntu-latest
            test-options: --all-features -p compare-demosaic
            pwd: ./crates/compare-demosaic
          - machine: macos-latest
            test-options: --workspace --all-features --exclude compare-demosaic
            pwd: ./
    env:
      dnc_version: 18_7
    runs-on: ${{matrix.machine}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        with:
          toolchain: nightly
          components: clippy
      - name: restore dnc
        if: ${{runner.os != 'Linux'}}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./temp/dnc${{env.dnc_version}}*
          key: dnc-${{ runner.os }}-${{env.dnc_version}}
      - if: ${{runner.os != 'Linux'}}
        run: ./scripts/install-dnc.ps1 -version ${{env.dnc_version}}
        shell: pwsh
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{!cancelled()}}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{!cancelled()}}
        with:
          global-options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/common/codecov@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ !cancelled() }}

  benchmark:
    name: benchmark (${{ matrix.package }})
    if: ${{ !github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: bench-decoder
            paths: |
              ./crates/fornax-decoder/**
              ./crates/fornax-decoder-rawler/**
              ./crates/bench-decoder/**

          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: aahd
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: ahd
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: amaze
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: dcb
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: dht
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: linear
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: lmmse
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: ppg
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: rcd
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: vng
          - package: fornax-postprocessor
            paths: ./crates/fornax-postprocessor/**
            algorithm: vng4

          - package: fornax-preprocessor
            paths: ./crates/fornax-preprocessor/**
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed-files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: ${{ matrix.paths }}
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true' }}
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true' }}
        with:
          options: -p ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ github.token }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/dev/lib:${{ env.LD_LIBRARY_PATH }}
          CARGO_WORKSPACE_DIR: ${{ github.workspace }}
          FORNAX_BENCH_ALGORITHM: ${{ matrix.algorithm }}

  compare-demosaic:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed-files
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            ./crates/compare-demosaic/**
            ./crates/fornax-postprocessor/demosaic/**
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true' }}
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true' }}
      - name: Test, run, compare
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true' }}
        shell: bash
        run: |
          source ./crates/compare-demosaic/scripts/setup.sh
          cmp="cargo run --release -q -p compare-demosaic --"
          $cmp readme --check
          $cmp run --artifacts
          $cmp diff crates/compare-demosaic/baseline/canonical.json \
            target/compare-demosaic/canonical.json | tee target/compare-demosaic/diff.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compare-demosaic
          path: target/compare-demosaic
          if-no-files-found: ignore

  book-assets:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test book asset checker
        run: python -m unittest book.scripts.test_check_assets
      - name: Check book assets
        run: python book/scripts/check_assets.py "${{ github.event.pull_request.base.sha }}"

  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs: [lefthook, main, benchmark, compare-demosaic, book-assets]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
