name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: documentation links
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository-local documentation links
        run: python3 scripts/check-doc-links.py

  changed:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    outputs:
      main: ${{ steps.changed-files.outputs.main_any_changed }}
      benchmark_formats: ${{ steps.benchmark-formats.outputs.formats }}
      benchmark_dng: ${{ steps.changed-files.outputs.benchmark_dng_any_changed }}
      benchmark_aahd: ${{ steps.changed-files.outputs.benchmark_aahd_any_changed }}
      benchmark_ahd: ${{ steps.changed-files.outputs.benchmark_ahd_any_changed }}
      benchmark_amaze: ${{ steps.changed-files.outputs.benchmark_amaze_any_changed }}
      benchmark_dcb: ${{ steps.changed-files.outputs.benchmark_dcb_any_changed }}
      benchmark_dht: ${{ steps.changed-files.outputs.benchmark_dht_any_changed }}
      benchmark_linear: ${{ steps.changed-files.outputs.benchmark_linear_any_changed }}
      benchmark_lmmse: ${{ steps.changed-files.outputs.benchmark_lmmse_any_changed }}
      benchmark_ppg: ${{ steps.changed-files.outputs.benchmark_ppg_any_changed }}
      benchmark_preprocessor: ${{ steps.changed-files.outputs.benchmark_preprocessor_any_changed }}
      benchmark_rcd: ${{ steps.changed-files.outputs.benchmark_rcd_any_changed }}
      benchmark_requested: ${{ steps.benchmark-requested.outputs.requested }}
      benchmark_vng: ${{ steps.changed-files.outputs.benchmark_vng_any_changed }}
      benchmark_vng4: ${{ steps.changed-files.outputs.benchmark_vng4_any_changed }}
      book_assets: ${{ steps.changed-files.outputs.book_assets_any_changed }}
      golden: ${{ steps.changed-files.outputs.golden_any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files_yaml: |
            main:
              - ./**
              - '!**/*.md'

            benchmark_decoder_common:
              - ./crates/fornax-codec/**
              - ./crates/fornax-tiff/**
              - ./crates/fornax-raw/Cargo.toml
              - ./crates/fornax-raw/src/bayer.rs
              - ./crates/fornax-raw/src/crop_cast.rs
              - ./crates/fornax-raw/src/decoder/mod.rs
              - ./crates/fornax-raw/src/decoder/dnc.rs
              - ./crates/fornax-raw/src/dng/**
              - ./crates/fornax-raw/src/error.rs
              - ./crates/fornax-raw/src/format.rs
              - ./crates/fornax-raw/src/lib.rs
              - ./crates/fornax-raw/src/metadata.rs
              - ./crates/fornax-raw/src/primitive.rs
              - ./crates/fornax-raw/src/protocol.rs
              - ./crates/fornax-raw/src/utils.rs
              - ./crates/fornax-raw/benches/decoder.rs
              - ./crates/fornax-raw/benches/decoder_inputs.rs
              - ./crates/fornax-raw/benches/decoder_selection.rs
              - ./crates/fornax-raw/benches/dng_gap_probe.rs
              - ./crates/fornax-raw/benches/dng_gap_probe/**
              - ./crates/fornax-raw/benches/flashraw_probe.rs
              - ./crates/fornax-raw/benches/flashraw_probe/**
              - ./crates/fornax-raw/benches/flashraw_wrapper.rs
              - ./crates/fornax-raw/benches/rawler_wrapper.rs
              - ./crates/fornax-raw/benches/reference_preflight.rs
              - '!**/*.md'

            benchmark_sony:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/sony/**
              - '!**/*.md'
            benchmark_canon:
              - ./crates/fornax-raw/src/decoder/canon/**
              - ./crates/fornax-bmff/**
              - '!**/*.md'
            benchmark_nikon:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/nikon/**
              - '!**/*.md'
            benchmark_fujifilm:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/fujifilm/**
              - '!**/*.md'
            benchmark_hasselblad:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/hasselblad/**
              - '!**/*.md'
            benchmark_panasonic:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/panasonic/**
              - '!**/*.md'
            benchmark_phase_one:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/decoder/phase_one/**
              - '!**/*.md'
            benchmark_dng:
              - ./crates/fornax-codec/**
              - ./crates/fornax-raw/src/dng/**
              - ./crates/fornax-raw/benches/writer.rs
              - '!**/*.md'

            benchmark_aahd:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_ahd:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_amaze:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_dcb:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_dht:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_linear:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_lmmse:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_ppg:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_rcd:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_vng:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'
            benchmark_vng4:
              - ./crates/fornax-raw/src/demosaic.rs
              - ./crates/fornax-raw/src/demosaic/**
              - '!**/*.md'

            benchmark_preprocessor:
              - ./crates/fornax-raw/src/preprocessor.rs
              - ./crates/fornax-raw/benches/preprocessor.rs
              - ./crates/fornax-raw/benches/support/**
              - '!**/*.md'

            book_assets:
              - ./book/**
            golden:
              - ./**
              - '!**/*.md'

      - id: benchmark-formats
        name: Select impacted decoder benchmark formats
        shell: bash
        env:
          ALL_CHANGED: ${{ steps.changed-files.outputs.benchmark_decoder_common_any_changed }}
          SONY_CHANGED: ${{ steps.changed-files.outputs.benchmark_sony_any_changed }}
          CANON_CHANGED: ${{ steps.changed-files.outputs.benchmark_canon_any_changed }}
          NIKON_CHANGED: ${{ steps.changed-files.outputs.benchmark_nikon_any_changed }}
          FUJIFILM_CHANGED: ${{ steps.changed-files.outputs.benchmark_fujifilm_any_changed }}
          HASSELBLAD_CHANGED: ${{ steps.changed-files.outputs.benchmark_hasselblad_any_changed }}
          PANASONIC_CHANGED: ${{ steps.changed-files.outputs.benchmark_panasonic_any_changed }}
          PHASE_ONE_CHANGED: ${{ steps.changed-files.outputs.benchmark_phase_one_any_changed }}
        run: |
          formats=
          if [[ "$ALL_CHANGED" == "true" ]]; then
            formats=all
          else
            [[ "$SONY_CHANGED" == "true" ]] && formats+="${formats:+,}ARW"
            [[ "$CANON_CHANGED" == "true" ]] && formats+="${formats:+,}CR3"
            [[ "$NIKON_CHANGED" == "true" ]] && formats+="${formats:+,}NEF"
            [[ "$FUJIFILM_CHANGED" == "true" ]] && formats+="${formats:+,}RAF"
            [[ "$HASSELBLAD_CHANGED" == "true" ]] && formats+="${formats:+,}3FR"
            [[ "$PANASONIC_CHANGED" == "true" ]] && formats+="${formats:+,}RW2"
            [[ "$PHASE_ONE_CHANGED" == "true" ]] && formats+="${formats:+,}IIQ"
          fi
          echo "formats=$formats" >>"$GITHUB_OUTPUT"

      - id: benchmark-requested
        name: Check whether any non-decoder benchmark changed
        shell: bash
        env:
          DNG_CHANGED: ${{ steps.changed-files.outputs.benchmark_dng_any_changed }}
          AAHD_CHANGED: ${{ steps.changed-files.outputs.benchmark_aahd_any_changed }}
          AHD_CHANGED: ${{ steps.changed-files.outputs.benchmark_ahd_any_changed }}
          AMAZE_CHANGED: ${{ steps.changed-files.outputs.benchmark_amaze_any_changed }}
          DCB_CHANGED: ${{ steps.changed-files.outputs.benchmark_dcb_any_changed }}
          DHT_CHANGED: ${{ steps.changed-files.outputs.benchmark_dht_any_changed }}
          LINEAR_CHANGED: ${{ steps.changed-files.outputs.benchmark_linear_any_changed }}
          LMMSE_CHANGED: ${{ steps.changed-files.outputs.benchmark_lmmse_any_changed }}
          PPG_CHANGED: ${{ steps.changed-files.outputs.benchmark_ppg_any_changed }}
          PREPROCESSOR_CHANGED: ${{ steps.changed-files.outputs.benchmark_preprocessor_any_changed }}
          RCD_CHANGED: ${{ steps.changed-files.outputs.benchmark_rcd_any_changed }}
          VNG_CHANGED: ${{ steps.changed-files.outputs.benchmark_vng_any_changed }}
          VNG4_CHANGED: ${{ steps.changed-files.outputs.benchmark_vng4_any_changed }}
        run: |
          requested=false
          for changed in \
            "$DNG_CHANGED" "$AAHD_CHANGED" "$AHD_CHANGED" "$AMAZE_CHANGED" \
            "$DCB_CHANGED" "$DHT_CHANGED" "$LINEAR_CHANGED" "$LMMSE_CHANGED" \
            "$PPG_CHANGED" "$PREPROCESSOR_CHANGED" "$RCD_CHANGED" \
            "$VNG_CHANGED" "$VNG4_CHANGED"; do
            if [[ "$changed" == "true" ]]; then
              requested=true
              break
            fi
          done
          echo "requested=$requested" >>"$GITHUB_OUTPUT"

  decoder-benchmark-plan:
    name: plan decoder benchmark matrix
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         ((github.event_name == 'push' || github.event_name == 'pull_request') &&
          needs.changed.outputs.benchmark_formats != ''))
      }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Build one matrix item per golden input
        shell: bash
        run: |
          python3 crates/decoder-tracker/scripts/benchmark_matrix.py \
            --manifest crates/decoder-tracker/golden/perf-manifest.csv \
            --formats "${{ github.event_name == 'workflow_dispatch' && 'all' || needs.changed.outputs.benchmark_formats }}" \
            --group "${{ github.event_name == 'workflow_dispatch' && 'all' || 'core' }}" \
            --github-output "$GITHUB_OUTPUT"

  lefthook:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write

  golden:
    name: golden decode hashes
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         github.event_name == 'push' ||
         github.event_name == 'schedule' ||
         (github.event_name == 'pull_request' &&
          (needs.changed.outputs.golden == 'true' ||
           needs.changed.outputs.benchmark_formats != '')))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Install tracker test tools
        run: pixi install -e tracker
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - name: Resolve pinned corpus commit
        id: corpus
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD:external/raw.pixls.us)" >>"$GITHUB_OUTPUT"
      - name: Restore selected golden LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/external/raw.pixls.us/lfs/objects
          key: golden-test-perf-corpus-v1-${{ steps.corpus.outputs.sha }}
      - name: Fetch test and perf LFS objects into shared cache
        shell: bash
        run: |
          include="$(python3 crates/decoder-tracker/scripts/golden_cache_include.py)"
          git -C external/raw.pixls.us lfs fetch origin --include="$include"
      - uses: Glatzel/template/.github/actions/rust/setup-rust@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        with:
          toolchain: nightly
      - name: Verify golden-set coverage
        shell: bash
        run: cargo run --release -p decoder-tracker -- golden-check
      - uses: Glatzel/template/.github/actions/rust/cargo-test@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        env:
          FORNAX_GOLDEN_CORPUS_REQUIRED: "1"
        with:
          global-options: --config 'profile.test.opt-level=3' -p decoder-tracker
          examples: false
          doc: false
      - uses: Glatzel/template/.github/actions/common/codecov@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{ !cancelled() }}

  main:
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name != 'pull_request' ||
         needs.changed.outputs.main == 'true')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: macos-latest
            test-options: --workspace --all-features
            pwd: ./
          - machine: ubuntu-latest
            test-options: --workspace --all-features
            pwd: ./
    runs-on: ${{matrix.machine}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Install tracker test tools
        run: pixi install -e tracker
      - uses: Glatzel/template/.github/actions/rust/setup-rust@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        with:
          toolchain: nightly
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{!cancelled()}}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{!cancelled()}}
        with:
          global-options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/common/codecov@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{ !cancelled() }}

  benchmark:
    name: benchmark (${{ matrix.label }})
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         ((github.event_name == 'push' || github.event_name == 'pull_request') &&
          needs.changed.outputs.benchmark_requested == 'true'))
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dng-writer
            changed: ${{ needs.changed.outputs.benchmark_dng }}
            extra-options: --bench writer
            raw-fixtures: true

          # - label: demosaic-aahd
          #   changed: ${{ needs.changed.outputs.benchmark_aahd }}
          #   extra-options: --bench demosaic
          #   algorithm: aahd
          # - label: demosaic-ahd
          #   changed: ${{ needs.changed.outputs.benchmark_ahd }}
          #   extra-options: --bench demosaic
          #   algorithm: ahd
          - label: demosaic-amaze
            changed: ${{ needs.changed.outputs.benchmark_amaze }}
            extra-options: --bench demosaic
            algorithm: amaze
          # - label: demosaic-dcb
          #   changed: ${{ needs.changed.outputs.benchmark_dcb }}
          #   extra-options: --bench demosaic
          #   algorithm: dcb
          - label: demosaic-dht
            changed: ${{ needs.changed.outputs.benchmark_dht }}
            extra-options: --bench demosaic
            algorithm: dht
          - label: demosaic-linear
            changed: ${{ needs.changed.outputs.benchmark_linear }}
            extra-options: --bench demosaic
            algorithm: linear
          - label: demosaic-lmmse
            changed: ${{ needs.changed.outputs.benchmark_lmmse }}
            extra-options: --bench demosaic
            algorithm: lmmse
          - label: demosaic-ppg
            changed: ${{ needs.changed.outputs.benchmark_ppg }}
            extra-options: --bench demosaic
            algorithm: ppg
          - label: demosaic-rcd
            changed: ${{ needs.changed.outputs.benchmark_rcd }}
            extra-options: --bench demosaic
            algorithm: rcd
          - label: demosaic-vng
            changed: ${{ needs.changed.outputs.benchmark_vng }}
            extra-options: --bench demosaic
            algorithm: vng
          - label: demosaic-vng4
            changed: ${{ needs.changed.outputs.benchmark_vng4 }}
            extra-options: --bench demosaic
            algorithm: vng4

          - label: preprocessor
            changed: ${{ needs.changed.outputs.benchmark_preprocessor }}
            extra-options: --bench preprocessor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
      - uses: Glatzel/template/.github/actions/rust/setup-rust@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
      - name: Initialize RAW fixtures
        if: ${{ matrix['raw-fixtures'] && (github.event_name == 'workflow_dispatch' || matrix.changed == 'true') }}
        run: bash scripts/setup.sh
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
        with:
          options: -p fornax-raw ${{ matrix['extra-options'] }} --all-features
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_WORKSPACE_DIR: ${{ github.workspace }}
          FORNAX_BENCH_ALGORITHM: ${{ matrix.algorithm }}
          FORNAX_BENCH_BITS: 32
          FORNAX_BENCH_DECODER: fornax,rawler

  decoder-benchmark:
    name: decoder benchmark (${{ matrix.label }})
    needs: [changed, decoder-benchmark-plan]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.decoder-benchmark-plan.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decoder-benchmark-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - name: Resolve pinned corpus commit
        id: corpus
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD:external/raw.pixls.us)" >>"$GITHUB_OUTPUT"
      - name: Restore shared test and perf LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/external/raw.pixls.us/lfs/objects
          key: golden-test-perf-corpus-v1-${{ steps.corpus.outputs.sha }}
      - name: Materialize the matrix input
        shell: bash
        env:
          FORNAX_BENCH_REPO_PATH: ${{ matrix.path }}
          FORNAX_BENCH_RAW: ${{ github.workspace }}/external/raw.pixls.us/${{ matrix.path }}
          FORNAX_BENCH_SHA256: ${{ matrix.sha256 }}
          FORNAX_BENCH_SIZE: ${{ matrix.size }}
        run: |
          git -C external/raw.pixls.us lfs install --local
          git -C external/raw.pixls.us lfs pull --include="$FORNAX_BENCH_REPO_PATH"
          test -f "$FORNAX_BENCH_RAW"
          test "$(stat -c '%s' "$FORNAX_BENCH_RAW")" = "$FORNAX_BENCH_SIZE"
          test "$(sha256sum "$FORNAX_BENCH_RAW" | cut -d' ' -f1)" = "$FORNAX_BENCH_SHA256"
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@6851c894419045fb3731d2643deba6b8faef3e82 # v2026.11.6
        with:
          options: -p fornax-raw --bench decoder ${{ matrix['cargo-options'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_WORKSPACE_DIR: ${{ github.workspace }}
          FORNAX_BENCH_DECODER: fornax
          FORNAX_BENCH_RAW: ${{ github.workspace }}/external/raw.pixls.us/${{ matrix.path }}
          OMP_NUM_THREADS: 1
          RAYON_NUM_THREADS: 1

  book-assets:
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.changed.outputs.book_assets == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test book asset checker
        run: python -m unittest book.scripts.test_check_assets
      - name: Check book assets
        run: python book/scripts/check_assets.py "${{ github.event.pull_request.base.sha }}"

  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs:
      [
        changed,
        decoder-benchmark-plan,
        lefthook,
        golden,
        main,
        benchmark,
        decoder-benchmark,
        book-assets,
      ]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
