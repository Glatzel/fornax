name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    outputs:
      main: ${{ steps.changed-files.outputs.main_any_changed }}
      benchmark_formats: ${{ steps.benchmark-formats.outputs.formats }}
      benchmark_dng: ${{ steps.changed-files.outputs.benchmark_dng_any_changed }}
      benchmark_raw_pipeline: ${{ steps.changed-files.outputs.benchmark_raw_pipeline_any_changed }}
      compare_demosaic: ${{ steps.changed-files.outputs.compare_demosaic_any_changed }}
      book_assets: ${{ steps.changed-files.outputs.book_assets_any_changed }}
      golden: ${{ steps.changed-files.outputs.golden_any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files_yaml: |
            main:
              - ./**
              - '!**/*.md'
            benchmark_all:
              - ./Cargo.toml
              - ./Cargo.lock
              - ./.github/workflows/ci.yml
              - ./crates/fornax-codec/**
              - ./crates/fornax-decoder/**
              - ./crates/fornax-dng/**
              - ./crates/fornax-raw-core/**
              - ./crates/fornax-tiff/**
              - ./crates/decoder-tracker/golden/**
              - ./crates/decoder-tracker/scripts/benchmark_*
              - '!**/*.md'
            benchmark_sony:
              - ./crates/fornax-raw-sony/**
              - '!**/*.md'
            benchmark_canon:
              - ./crates/fornax-raw-canon/**
              - ./crates/fornax-bmff/**
              - '!**/*.md'
            benchmark_nikon:
              - ./crates/fornax-raw-nikon/**
              - '!**/*.md'
            benchmark_fujifilm:
              - ./crates/fornax-raw-fujifilm/**
              - '!**/*.md'
            benchmark_hasselblad:
              - ./crates/fornax-raw-hasselblad/**
              - '!**/*.md'
            benchmark_panasonic:
              - ./crates/fornax-raw-panasonic/**
              - '!**/*.md'
            benchmark_phase_one:
              - ./crates/fornax-raw-phase-one/**
              - '!**/*.md'
            benchmark_dng:
              - ./crates/fornax-codec/**
              - ./crates/fornax-dng/**
              - ./crates/fornax-tiff/**
              - '!**/*.md'
            benchmark_raw_pipeline:
              - ./crates/fornax-raw-pipeline/**
              - '!**/*.md'
            compare_demosaic:
              - ./crates/compare-demosaic/**
              - ./crates/fornax-raw-core/**
              - ./crates/fornax-raw-pipeline/src/demosaic/**
              - '!**/*.md'
            book_assets:
              - ./book/**
            golden:
              - ./crates/fornax-codec/**
              - ./crates/fornax-tiff/**
              - ./crates/fornax-dng/**
              - ./crates/fornax-raw-sony/**
              - ./crates/fornax-decoder/**
              - ./crates/fornax-raw-core/**
              - ./crates/fornax-raw-pipeline/**
              - ./crates/decoder-tracker/**
      - id: benchmark-formats
        name: Select impacted decoder benchmark formats
        shell: bash
        env:
          ALL_CHANGED: ${{ steps.changed-files.outputs.benchmark_all_any_changed }}
          SONY_CHANGED: ${{ steps.changed-files.outputs.benchmark_sony_any_changed }}
          CANON_CHANGED: ${{ steps.changed-files.outputs.benchmark_canon_any_changed }}
          NIKON_CHANGED: ${{ steps.changed-files.outputs.benchmark_nikon_any_changed }}
          FUJIFILM_CHANGED: ${{ steps.changed-files.outputs.benchmark_fujifilm_any_changed }}
          HASSELBLAD_CHANGED: ${{ steps.changed-files.outputs.benchmark_hasselblad_any_changed }}
          PANASONIC_CHANGED: ${{ steps.changed-files.outputs.benchmark_panasonic_any_changed }}
          PHASE_ONE_CHANGED: ${{ steps.changed-files.outputs.benchmark_phase_one_any_changed }}
        run: |
          formats=
          if [[ "$ALL_CHANGED" == "true" ]]; then
            formats=all
          else
            [[ "$SONY_CHANGED" == "true" ]] && formats+="${formats:+,}ARW"
            [[ "$CANON_CHANGED" == "true" ]] && formats+="${formats:+,}CR3"
            [[ "$NIKON_CHANGED" == "true" ]] && formats+="${formats:+,}NEF"
            [[ "$FUJIFILM_CHANGED" == "true" ]] && formats+="${formats:+,}RAF"
            [[ "$HASSELBLAD_CHANGED" == "true" ]] && formats+="${formats:+,}3FR"
            [[ "$PANASONIC_CHANGED" == "true" ]] && formats+="${formats:+,}RW2"
            [[ "$PHASE_ONE_CHANGED" == "true" ]] && formats+="${formats:+,}IIQ"
          fi
          echo "formats=$formats" >>"$GITHUB_OUTPUT"

  decoder-benchmark-plan:
    name: plan decoder benchmark matrix
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         ((github.event_name == 'push' || github.event_name == 'pull_request') &&
          needs.changed.outputs.benchmark_formats != ''))
      }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Build one matrix item per golden input
        shell: bash
        run: |
          python3 crates/decoder-tracker/scripts/benchmark_matrix.py \
            --manifest crates/decoder-tracker/golden/selected-manifest.csv \
            --formats "${{ github.event_name == 'workflow_dispatch' && 'all' || needs.changed.outputs.benchmark_formats }}" \
            --github-output "$GITHUB_OUTPUT"

  lefthook:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write

  golden:
    name: golden decode hashes
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'push' ||
         github.event_name == 'schedule' ||
         (github.event_name == 'pull_request' &&
          needs.changed.outputs.golden == 'true'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - name: Resolve pinned corpus commit
        id: corpus
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD:external/raw.pixls.us)" >>"$GITHUB_OUTPUT"
      - name: Restore selected golden LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/external/raw.pixls.us/lfs/objects
          key: golden-corpus-${{ steps.corpus.outputs.sha }}
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Build decoder-tracker
        run: cargo build --locked --release -p decoder-tracker
      - name: Check golden decode hashes
        run: |
          target/release/decoder-tracker hash \
            --manifest crates/decoder-tracker/golden/selected-manifest.csv \
            --check crates/decoder-tracker/golden/decode-hashes.csv

  main:
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name != 'pull_request' ||
         needs.changed.outputs.main == 'true')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-latest
            test-options: --all-features -p compare-demosaic
            pwd: ./crates/compare-demosaic
          - machine: macos-latest
            test-options: -p fornax-decoder
            pwd: ./
          - machine: ubuntu-latest
            test-options: --workspace --all-features --exclude compare-demosaic
            pwd: ./
    runs-on: ${{matrix.machine}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        with:
          toolchain: nightly
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{!cancelled()}}
        with:
          options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{!cancelled()}}
        with:
          global-options: ${{ matrix.test-options }}
          working-directory: ${{matrix.pwd}}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Glatzel/template/.github/actions/common/codecov@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ !cancelled() }}

  benchmark:
    name: benchmark (${{ matrix.package }})
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         ((github.event_name == 'push' || github.event_name == 'pull_request') &&
          (needs.changed.outputs.benchmark_dng == 'true' ||
           needs.changed.outputs.benchmark_raw_pipeline == 'true')))
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: fornax-dng
            changed: ${{ needs.changed.outputs.benchmark_dng }}

          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: aahd
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: ahd
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: amaze
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: dcb
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: dht
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: linear
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: lmmse
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: ppg
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: rcd
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: vng
          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench demosaic
            algorithm: vng4

          - package: fornax-raw-pipeline
            changed: ${{ needs.changed.outputs.benchmark_raw_pipeline }}
            extra-options: --bench preprocessor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
      - name: Initialize RAW fixtures
        if: ${{ matrix.package == 'fornax-dng' && (github.event_name == 'workflow_dispatch' || matrix.changed == 'true') }}
        run: bash scripts/setup.sh
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.changed == 'true' }}
        with:
          options: -p ${{ matrix.package }} ${{ matrix['extra-options'] }} --all-features
        env:
          GH_TOKEN: ${{ github.token }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/dev/lib:${{ env.LD_LIBRARY_PATH }}
          CARGO_WORKSPACE_DIR: ${{ github.workspace }}
          FORNAX_BENCH_ALGORITHM: ${{ matrix.algorithm }}
          FORNAX_BENCH_BITS: 32
          FORNAX_BENCH_DECODER: fornax,rawler

  decoder-benchmark:
    name: decoder benchmark (${{ matrix.label }})
    needs: [changed, decoder-benchmark-plan]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.decoder-benchmark-plan.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decoder-benchmark-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Initialize pointer-only corpus
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git -c filter.lfs.required=false \
            -c submodule.external/raw.pixls.us.branch=master \
            submodule update --init --remote external/raw.pixls.us
      - name: Materialize the matrix input
        shell: bash
        env:
          FORNAX_BENCH_REPO_PATH: ${{ matrix.path }}
          FORNAX_BENCH_RAW: ${{ github.workspace }}/external/raw.pixls.us/${{ matrix.path }}
          FORNAX_BENCH_SHA256: ${{ matrix.sha256 }}
          FORNAX_BENCH_SIZE: ${{ matrix.size }}
        run: |
          git -C external/raw.pixls.us lfs install --local
          git -C external/raw.pixls.us lfs pull --include="$FORNAX_BENCH_REPO_PATH"
          test -f "$FORNAX_BENCH_RAW"
          test "$(stat -c '%s' "$FORNAX_BENCH_RAW")" = "$FORNAX_BENCH_SIZE"
          test "$(sha256sum "$FORNAX_BENCH_RAW" | cut -d' ' -f1)" = "$FORNAX_BENCH_SHA256"
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
        with:
          options: -p fornax-decoder --bench decoder ${{ matrix['cargo-options'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/dev/lib:${{ env.LD_LIBRARY_PATH }}
          CARGO_WORKSPACE_DIR: ${{ github.workspace }}
          FORNAX_BENCH_DECODER: fornax,rawler,flashraw
          FORNAX_BENCH_RAW: ${{ github.workspace }}/external/raw.pixls.us/${{ matrix.path }}
          OMP_NUM_THREADS: 1
          RAYON_NUM_THREADS: 1

  compare-demosaic:
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'pull_request' &&
          needs.changed.outputs.compare_demosaic == 'true'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Test, run, compare
        shell: bash
        run: |
          source ./crates/compare-demosaic/scripts/setup.sh
          cmp="cargo run --release -p compare-demosaic --"
          $cmp readme --check
          $cmp run --artifacts
          $cmp diff crates/compare-demosaic/baseline/canonical.json \
            target/compare-demosaic/canonical.json | tee target/compare-demosaic/diff.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compare-demosaic
          path: target/compare-demosaic
          if-no-files-found: ignore

  book-assets:
    needs: changed
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.changed.outputs.book_assets == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test book asset checker
        run: python -m unittest book.scripts.test_check_assets
      - name: Check book assets
        run: python book/scripts/check_assets.py "${{ github.event.pull_request.base.sha }}"

  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs:
      [
        changed,
        decoder-benchmark-plan,
        lefthook,
        golden,
        main,
        benchmark,
        decoder-benchmark,
        compare-demosaic,
        book-assets,
      ]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
