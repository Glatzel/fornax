name: Compare demosaic

on:
  workflow_dispatch:
    inputs:
      methods:
        description: Demosaicing method(s) to run (`linear`, `ppg`, `all`, or comma-separated).
        type: string
        required: true
        default: "all"

concurrency:
  group: compare-demosaic-${{ github.ref }}-${{ inputs.methods }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@30e739f98054a90001752326e4ba90918f10d895 # v2026.11.4
      - name: Install compare-demosaic environment
        run: pixi install -e compare-demosaic
      - name: Run demosaic comparison
        shell: bash
        env:
          REQUESTED_METHODS: ${{ inputs.methods }}
        run: pixi run -e compare-demosaic compare-demosaic --method "$REQUESTED_METHODS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-demosaic-results
          path: |
            crates/compare-demosaic/chart/demosaic_chart.svg
            crates/compare-demosaic/data/
            crates/compare-demosaic/README.md
            temp/compare-demosaic/
          retention-days: 7
          if-no-files-found: error
