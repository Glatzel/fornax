name: Compare demosaic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/compare-demosaic/**"
      - "crates/fornax-postprocessor/**"
      - "crates/fornax-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compare-demosaic-canonical.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@abc2dfda04597e174777b47175ff07a1b8000784 # v2026.11.1
      - name: Test and check
        shell: bash
        run: |
          source scripts/setup.sh
          cargo test -p compare-demosaic --all-features
          cargo run --release -p compare-demosaic -- --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compare-demosaic
          path: target/compare-demosaic
          if-no-files-found: warn
