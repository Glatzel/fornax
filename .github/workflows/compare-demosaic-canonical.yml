name: Compare demosaic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/compare-demosaic/**"
      - "crates/fornax-postprocessor/**"
      - "crates/fornax-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compare-demosaic-canonical.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - uses: Glatzel/template/.github/actions/rust/setup-rust@7c77db8d35c45b3b88b01e0dafc5b5e931cf5a8a # v2026.11.2
      - name: Test, run, compare
        shell: bash
        run: |
          source scripts/setup.sh
          cargo test -p compare-demosaic --all-features
          cmp="cargo run --release -q -p compare-demosaic --"
          $cmp readme --check
          $cmp run --artifacts
          $cmp diff crates/compare-demosaic/baseline/canonical.json \
            target/compare-demosaic/canonical.json | tee target/compare-demosaic/diff.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compare-demosaic
          path: target/compare-demosaic
          if-no-files-found: ignore
