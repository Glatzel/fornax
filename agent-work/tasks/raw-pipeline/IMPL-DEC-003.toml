schema_version = 1
id = "IMPL-DEC-003"
slug = "libraw-decoder"
title = "Implement and validate the LibRaw decoder"
phase = "implementation"
dependencies = ["IMPL-CORE-001", "DES-002", "DES-003"]
parallelism = "Can run in parallel with IMPL-DEC-004 in a separate decoder member; root Cargo changes are serialized."
deliverables = [
  "fornax::decoder::libraw implementation",
  "LibRaw format fixtures and conformance tests",
  "legacy libraw wrapper removal",
]
scope = """
Implement the private `fornax::decoder::libraw` module around LibRaw's
unpack/raw-image path through optional `libraw-sys`. Compact backend buffers,
translate CFA and metadata with provenance, preserve native sample semantics,
and classify unsupported layouts and formats structurally. Move or remove the
deprecated public `libraw` wrapper in this task; retain `libraw-sys` as private
FFI support only.
"""
acceptance = [
  "The decoder invokes only the LibRaw unpack/decode surface needed to expose stored RAW samples and never calls LibRaw post-processing.",
  "DNG, Sony ARW, Nikon NEF, and Canon CR2/CR3 outcomes are tested where fixtures exist, or explicitly documented as unavailable with backend risk.",
  "Buffer dimensions, stride compaction, native sample specification, ActiveArea, CFA phase, black/white levels, crop metadata, and decoder provenance are asserted.",
  "Non-Bayer, LinearRaw, X-Trans, Foveon, Quad Bayer, monochrome, wider sample specifications, and deferred formats are rejected structurally.",
  "LibRaw types remain private to `fornax::decoder::libraw`; the legacy public `libraw` wrapper is removed or fully absorbed by this task.",
  "The backend stays opt-in and its LGPL/CDDL and native-link distribution decisions are recorded.",
]
validation = [
  "Verify IMPL-CORE-001, DES-002, and DES-003 PRs are merged.",
  "Run focused LibRaw conformance and `cargo test -p fornax --features backend-libraw`.",
  "Record fixture provenance, tested cameras/formats, checksums, backend limits, licenses, and unavailable coverage.",
  "Run cargo metadata and verify no public `libraw` wrapper dependency remains.",
]
