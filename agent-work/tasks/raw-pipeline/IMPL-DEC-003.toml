title = "Implement the dnglab/rawler decoder adapter"
phase = "implementation"
dependencies = ["IMPL-DEC-001", "DES-002", "DES-003"]
parallelism = "Can run in parallel with IMPL-DEC-002 through a separate module; root Cargo changes are serialized."
