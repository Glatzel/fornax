scope = """
Implement the private `fornax::decoder::rawler` module around the workspace
crates.io rawler 0.8.0 dependency. Snapshot RAW samples and metadata before any
scaling or downstream conversion, translate DNG and vendor fields into the
universal model with provenance, and use rawler's target-format dispatch for
DNG, ARW, NEF, and Canon CR*.
"""
acceptance = [
