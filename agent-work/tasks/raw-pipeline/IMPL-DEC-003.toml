Implement the private `fornax::decode::rawler` module around the pinned rawler
dependency. Snapshot RAW samples and metadata before any scaling or downstream
conversion, translate DNG and vendor fields into the universal model with
provenance, and use the pinned backend's target-format dispatch for DNG, ARW,
NEF, and Canon CR*.
"""
