  "DNG ActiveArea, CFA phase, sample specification, declared/adjusted/measured white levels, black levels, and crop semantics map without lossy guessing.",
  "Crate-integer and vendor metadata are translated through typed values or namespaced provenance-aware entries.",
  "Unsupported non-RGB, non-Bayer, LinearRaw, wider sample, and unverified metadata cases fail structurally.",
  "Rawler types remain private to `fornax::decoder::rawler` and only the backend constructor/config is public.",
  "rawler is consumed from crates.io at the workspace-pinned version 0.8.0, and its LGPL-2.1 distribution decision is recorded before any default-feature or release claim.",
]
validation = [
  "Verify IMPL-DEC-001, DES-002, and DES-003 PRs are merged.",
  "Run focused rawler mapping and rejection tests plus `cargo test -p fornax --features backend-dnglab`.",
