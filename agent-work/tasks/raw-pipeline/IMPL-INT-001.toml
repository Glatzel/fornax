  "Backend and algorithm selection are explicit and recorded in provenance.",
  "Metadata and processing state remain valid across every stage transition and in the final output.",
  "No white balance, camera color matrix, highlight reconstruction, tone mapping, denoising, sharpening, or display rendering is applied.",
  "Stage failures are wrapped with context in a structured top-level error.",
  "Supported feature combinations build independently and backend types remain hidden.",
]
