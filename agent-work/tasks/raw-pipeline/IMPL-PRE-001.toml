scope = """
Implement the complete standard preprocessing path behind the single consuming
`DecodedRaw::preprocess` entry point. Keep the ordered numerical substeps in a
private `decoded_raw::preprocess` submodule: exact conversion to the f32 working
plane, identity or validated lookup-table linearization, ActiveArea-relative
black selection and subtraction, normalization, and final clipping. Support
the validated common, four-slot, and conventional 1x1/2x2 repeat black-level
decompositions on every supported stored plane. Use f64 scalar arithmetic,
checked allocation, and typed errors. Do not add a preprocessing trait, options
wrapper, public intermediate image type, or callable partial pipeline stage.
"""
