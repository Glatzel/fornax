[package]
name = "fornax-raw-decoder"
version.workspace = true
edition.workspace = true

[features]
default = ["mmap"]
mmap = ["dep:memmap2", "fornax-tiff/mmap"]
zstd = ["fornax-dng/zstd"]

[[bench]]
harness = false
name = "decoder"

[[bench]]
harness = false
name = "dng_gap_probe"

[[bench]]
harness = false
name = "flashraw_probe"

[dependencies]
clerk.workspace = true
fornax-bmff.workspace = true
fornax-codec = { workspace = true, features = ["lossless-jpeg"] }
fornax-dng.workspace = true
fornax-large-alloc.workspace = true
fornax-raw-core.workspace = true
fornax-tiff = { workspace = true, default-features = false }
generic-num.workspace = true
image.workspace = true
memmap2 = { workspace = true, optional = true }
rayon.workspace = true

[dev-dependencies]
bytemuck.workspace = true
criterion.workspace = true
csv.workspace = true
flashraw = "=0.4.0"
libc.workspace = true
rawler = "0.8.0"
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
strum.workspace = true
