[package]
name = "fornax"
version.workspace = true
edition.workspace = true

[dependencies]
image.workspace = true
rawler = { git = "https://github.com/dnglab/dnglab.git", rev = "62b77de1a206d467e910d55199191068b45a9cc1", optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
libraw-sys = { workspace = true, optional = true }

[features]
default = []
backend-libraw = ["dep:libraw-sys"]
backend-dnglab = ["dep:rawler"]
backend-dnc = []
parallel = ["dep:rayon"]
serde = ["dep:serde"]
