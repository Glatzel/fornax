[package]
name = "fornax"
version.workspace = true
edition.workspace = true

[[bench]]
harness = false
name = "demosaic"

[dependencies]
image.workspace = true
libraw = { workspace = true, optional = true }
rawler = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
fornax-devtool.workspace = true
mischief.workspace = true

[features]
default = []
backend-dnc = []
backend-dnglab = ["dep:rawler"]
backend-libraw = ["dep:libraw"]
parallel = ["dep:rayon"]
serde = ["dep:serde"]
