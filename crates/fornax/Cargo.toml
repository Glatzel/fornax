[package]
name = "fornax"
version.workspace = true
edition.workspace = true

[dependencies]
clerk.workspace = true
envoy = { workspace = true, optional = true }
generic-num.workspace = true
image.workspace = true
libraw-sys = { workspace = true, optional = true }
num_enum = { workspace = true, optional = true }
num-traits.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
bytemuck= { workspace = true, optional = true }
jiff = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
fornax-devtool.workspace = true
mischief.workspace = true
rand.workspace = true

[features]
default = ["backend-dnc", "backend-libraw"]
backend-dnc = ["backend-libraw"]
backend-libraw = ["dep:libraw-sys", "envoy", "num_enum"]
serde = ["dep:serde"]
