[package]
name = "fornax"
version.workspace = true
edition.workspace = true

[dependencies]
fornax-core.workspace = true
fornax-decoder-dnc = { workspace = true, optional = true }
fornax-demosaic.workspace = true
fornax-preprocessor.workspace = true
libraw = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
fornax-devtool.workspace = true
mischief.workspace = true
image.workspace = true

[features]
default = ["backend-dnc", "backend-libraw"]
backend-dnc = ["backend-libraw", "dep:fornax-decoder-dnc"]
backend-libraw = ["dep:libraw"]
serde = [
  "dep:serde",
]
