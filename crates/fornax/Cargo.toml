[package]
name = "fornax"
version.workspace = true
edition.workspace = true

[dependencies]
clerk.workspace = true
fornax-core.workspace = true
fornax-decoder-dnc = { workspace = true, optional = true }
fornax-decoder-libraw = { workspace = true, optional = true }
fornax-decoder-protocol.workspace = true
fornax-metadata.workspace = true
generic-num.workspace = true
image.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
fornax-devtool.workspace = true
mischief.workspace = true
rand.workspace = true

[features]
default = ["backend-dnc", "backend-libraw"]
backend-dnc = ["dep:fornax-decoder-dnc", "backend-libraw"]
backend-libraw = ["dep:fornax-decoder-libraw"]
serde = [
    "dep:serde",
    "fornax-decoder-dnc?/serde",
    "fornax-decoder-libraw?/serde",
]
