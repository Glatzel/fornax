[package]
name = "fornax-raw"
version.workspace = true
edition.workspace = true

[features]
default = ["mmap", "large-page-hint"]
mmap = ["dep:memmap2", "fornax-tiff/mmap"]
large-page-hint = ["fornax-large-alloc/large-page-hint"]
metadata-json = ["dep:serde_json"]
zstd = ["fornax-codec/zstd", "fornax-tiff/zstd"]

[[bench]]
harness = false
name = "decoder"

[[bench]]
harness = false
name = "demosaic"

[[bench]]
harness = false
name = "dng_gap_probe"

[[bench]]
harness = false
name = "flashraw_probe"

[[bench]]
harness = false
name = "preprocessor"

[[bench]]
harness = false
name = "writer"

[dependencies]
bytemuck.workspace = true
clerk.workspace = true
fornax-bmff.workspace = true
fornax-codec = { workspace = true, features = ["jpegxl", "lossless-jpeg", "lossy-jpeg"] }
fornax-core.workspace = true
fornax-large-alloc = { workspace = true, default-features = false }
fornax-tiff = { workspace = true, default-features = false, features = ["jpegxl", "raster"] }
generic-num.workspace = true
image.workspace = true
memmap2 = { workspace = true, optional = true }
num_enum.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde_json = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytemuck.workspace = true
criterion.workspace = true
csv.workspace = true
flashraw = "=0.4.0"
fornax-devtool.workspace = true
image.workspace = true
insta.workspace = true
libc.workspace = true
mischief.workspace = true
rand.workspace = true
rawler = "0.8.0"
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
