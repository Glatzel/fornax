[package]
name = "fornax-codec"
version.workspace = true
edition.workspace = true

[[test]]
name = "iiq"
required-features = ["iiq"]

[dependencies]
bytemuck.workspace = true
flate2 = { workspace = true, optional = true }
image.workspace = true
jxl-oxide = { workspace = true, optional = true }
rayon.workspace = true
thiserror.workspace = true
weezl = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true, features = ["jpeg"] }

[features]
default = ["lzw", "packbits"]
arw = ["lossless-jpeg"]
cr3 = []
deflate = ["dep:flate2"]
iiq = []
jpegxl = ["dep:jxl-oxide"]
lossless-jpeg = []
lossy-jpeg = ["dep:zune-jpeg"]
lzw = ["dep:weezl"]
nef = []
packbits = []
raf = []
rw2 = []
zstd = ["dep:zstd"]
