[package]
name = "fornax-codec"
version.workspace = true
edition.workspace = true

[features]
default = ["large-page-hint", "lzw", "packbits"]
deflate = ["dep:flate2"]
jpegxl = ["dep:jxl-oxide"]
large-page-hint = ["fornax-large-alloc/large-page-hint"]
lossless-jpeg = []
lossy-jpeg = ["dep:zune-jpeg"]
lzw = ["dep:weezl"]
packbits = []
zstd = ["dep:zstd"]

[[bench]]
harness = false
name = "ljpeg_gap_probe"
required-features = ["lossless-jpeg"]

[[bench]]
harness = false
name = "encode_probe"

[dependencies]
bytemuck.workspace = true
flate2 = { workspace = true, optional = true }
fornax-core.workspace = true
fornax-large-alloc = { workspace = true, default-features = false }
image.workspace = true
jxl-oxide = { workspace = true, optional = true }
rayon.workspace = true
thiserror.workspace = true
weezl = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true, features = ["jpeg"] }
