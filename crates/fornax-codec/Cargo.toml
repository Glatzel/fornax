[package]
name = "fornax-codec"
version.workspace = true
edition.workspace = true

[features]
default = ["lzw", "packbits"]
deflate = ["dep:flate2"]
jpegxl = ["dep:jxl-oxide"]
lossless-jpeg = []
lossy-jpeg = ["dep:zune-jpeg"]
lzw = ["dep:weezl"]
packbits = []
zstd = ["dep:zstd"]

[[bench]]
harness = false
name = "ljpeg_gap_probe"
required-features = ["lossless-jpeg"]

[[bench]]
harness = false
name = "encode_probe"

[dependencies]
bytemuck.workspace = true
flate2 = { workspace = true, optional = true }
image.workspace = true
jxl-oxide = { workspace = true, optional = true }
rayon.workspace = true
thiserror.workspace = true
weezl = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
