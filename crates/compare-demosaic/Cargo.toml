[package]
name = "compare-demosaic"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false

[features]
render-readme = ["dep:comfy-table"]

[dependencies]
comfy-table = { workspace = true, optional = true }
fornax-core.workspace = true
fornax-decoder-rawler.workspace = true
fornax-postprocessor.workspace = true
fornax-preprocessor.workspace = true
indicatif.workspace = true
mischief.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rstest.workspace = true

[[bin]]
name = "render-readme"
path = "src/bin/render_readme.rs"
required-features = ["render-readme"]

[build-dependencies]
cc.workspace = true
libraw-sys.workspace = true
