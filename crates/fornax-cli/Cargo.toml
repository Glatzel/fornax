[package]
name = "fornax-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fornax"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fornax-core.workspace = true
fornax-decoder.workspace = true
fornax-decoder-rawler.workspace = true
fornax-dng = { workspace = true, features = ["metadata-json", "zstd"] }
fornax-postprocessor.workspace = true
fornax-preprocessor.workspace = true
image = { workspace = true, features = ["jpeg", "tiff"] }
num-traits.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
clap-verbosity-flag.workspace = true
clap-style.workspace = true
clerk = { workspace = true, features = ["tracing"] }

[dev-dependencies]
assert_cmd.workspace = true
fornax-tiff.workspace = true
tempfile.workspace = true
