[package]
name = "fornax-dng"
version.workspace = true
edition.workspace = true

[features]
default = ["large-page-hint"]
large-page-hint = ["fornax-large-alloc/large-page-hint"]
metadata-json = ["dep:serde", "dep:serde_json"]
zstd = ["fornax-codec/zstd", "fornax-tiff/zstd"]

[[bench]]
harness = false
name = "writer"

[dependencies]
bytemuck.workspace = true
fornax-core.workspace = true
fornax-large-alloc = { workspace = true, default-features = false }
fornax-raw-core.workspace = true
generic-num.workspace = true
image.workspace = true
num_enum.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true

[dependencies.fornax-codec]
workspace = true
default-features = false
features = ["jpegxl", "lossless-jpeg", "lossy-jpeg"]

[dependencies.fornax-tiff]
workspace = true
default-features = false
features = ["jpegxl", "raster"]

[dev-dependencies]
criterion.workspace = true
fornax-devtool.workspace = true
