[package]
name = "fornax-dng"
version.workspace = true
edition.workspace = true

[[bench]]
harness = false
name = "writer"

[features]
default = []
metadata-json = ["dep:serde", "dep:serde_json"]
zstd = ["dep:structured-zstd"]

[dependencies]
flashraw-codecs.workspace = true
flate2.workspace = true
fornax-core.workspace = true
fornax-tiff.workspace = true
generic-num.workspace = true
image = { workspace = true, features = ["jpeg"] }
jxl-oxide.workspace = true
num_enum.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
zune-jpeg.workspace = true
structured-zstd = { version = "0.2.6", optional = true }

[dev-dependencies]
criterion.workspace = true
fornax-devtool.workspace = true
