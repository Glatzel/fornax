[package]
name = "fornax-decoder"
version.workspace = true
edition.workspace = true

[[bench]]
harness = false
name = "decoder"

[dependencies]
clerk.workspace = true
fornax-raw-sony = { workspace = true, optional = true }
fornax-raw-canon = { workspace = true, optional = true }
fornax-dng.workspace = true
fornax-raw-hasselblad = { workspace = true, optional = true }
fornax-raw-phase-one = { workspace = true, optional = true }
fornax-raw-nikon = { workspace = true, optional = true }
fornax-raw-fujifilm = { workspace = true, optional = true }
fornax-raw-core.workspace = true
fornax-raw-panasonic = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
csv.workspace = true
flashraw = "=0.2.0"
fornax-codec.workspace = true
fornax-tiff.workspace = true
generic-num.workspace = true
image.workspace = true
rawler = "0.8.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
strum.workspace = true

[features]
default = [
    "sony",
    "canon",
    "nikon",
    "fujifilm",
    "hasselblad",
    "panasonic",
    "phase-one",
]
canon = ["dep:fornax-raw-canon"]
fujifilm = ["dep:fornax-raw-fujifilm"]
hasselblad = ["dep:fornax-raw-hasselblad"]
nikon = ["dep:fornax-raw-nikon"]
panasonic = ["dep:fornax-raw-panasonic"]
phase-one = ["dep:fornax-raw-phase-one"]
sony = ["dep:fornax-raw-sony"]
zstd = ["fornax-dng/zstd"]
