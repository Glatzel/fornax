[package]
name = "fornax-tiff"
version.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
fornax-codec = {
  workspace = true,
  default-features = false,
  features = ["deflate", "lossless-jpeg"],
  optional = true
}
memmap2 = { workspace = true, optional = true }
num_enum.workspace = true
strum.workspace = true

[features]
default = ["lzw", "mmap", "packbits"]
jpegxl = ["fornax-codec/jpegxl", "raster"]
lzw = ["fornax-codec/lzw", "raster"]
mmap = ["dep:memmap2"]
packbits = ["fornax-codec/packbits", "raster"]
raster = ["dep:fornax-codec"]
zstd = ["fornax-codec/zstd", "raster"]
